# MetaLake's connector for Arroyo (crates/metalake-arroyo), built as Arroyo builds: its toolchain, protoc for its
# protobufs, Python for its UDFs, its patched crates and a lock that holds Arrow at its 58.4.
name: arroyo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arroyo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metalake-arroyo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crates/metalake-arroyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: protoc, as Arroyo's CI installs it
        run: |
          wget -q https://github.com/protocolbuffers/protobuf/releases/download/v21.8/protoc-21.8-linux-x86_64.zip
          unzip -q protoc-21.8-linux-x86_64.zip -d /tmp/protoc
          sudo mv /tmp/protoc/bin/protoc /usr/local/bin
      - name: The toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - name: Its patches are Arroyo's at its rev
        run: bash ../../ci/arroyo-patch.sh
      - name: Its lock holds Arrow at 58.4
        run: bash ../../ci/arroyo-lock.sh --check
      - name: Format
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked
