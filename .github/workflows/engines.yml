# Engines that take long to set up, against the Iceberg REST server: Trino in its image, and Flink with Iceberg's runtime.
# Apart from `protocol`, so that a change of the server is held to them without the suites of the protocol.
name: engines

# The server is built on the core, its SDK and the protocol's SQL: a change of any of them is held to the engines too.
on:
  push:
    branches: [main]
    paths:
      - crates/metalake-iceberg/**
      - crates/metalake/**
      - crates/metalake-pg/**
      - sql/**
      - .github/workflows/engines.yml
  pull_request:
    branches: [main]
    paths:
      - crates/metalake-iceberg/**
      - crates/metalake/**
      - crates/metalake-pg/**
      - sql/**
      - .github/workflows/engines.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true

env:
  ICEBERG: "1.11.0"
  HADOOP: "3.4.1"

jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      METALAKE_TEST_PYTHON: python
      METALAKE_TEST_ENGINES: trino,flink
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Clients
        run: python -m pip install --quiet trino==0.340.0 apache-flink==1.20.3
      - name: Trino
        run: docker pull --quiet trinodb/trino:484
      - name: Iceberg's runtime for Flink
        run: |
          cd "$(python -c 'import os, pyflink; print(os.path.dirname(pyflink.__file__))')/lib"
          maven=https://repo1.maven.org/maven2/org/apache
          curl -fsSLO "$maven/iceberg/iceberg-flink-runtime-1.20/$ICEBERG/iceberg-flink-runtime-1.20-$ICEBERG.jar"
          curl -fsSLO "$maven/hadoop/hadoop-client-api/$HADOOP/hadoop-client-api-$HADOOP.jar"
          curl -fsSLO "$maven/hadoop/hadoop-client-runtime/$HADOOP/hadoop-client-runtime-$HADOOP.jar"
      - name: The engines
        run: CRATE=metalake-iceberg bash sql/test.sh --test c12_engines
