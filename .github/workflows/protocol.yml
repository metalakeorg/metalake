# What needs a Postgres in Docker: the specification's suites, the protocol, the core and the Iceberg REST server. The
# suites run as five jobs at once, each with its own Postgres and its own cache of what Rust compiled, so that the
# workflow takes as long as its longest group, not the sum of them.
name: protocol

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: The specification and the protocol
            clients: true
            run: |
              bash spec/v0/run.sh
              bash spec/v0/conformance/iceberg/run.sh
              bash sql/test.sh
              TLS=1 CRATE=metalake-pg bash sql/test.sh --test c_connect
          - name: The core and the client
            run: |
              CRATE=metalake bash sql/test.sh
              bash sql/commit-time.sh
              CRATE=metalake-client bash sql/test.sh --features distributed
          - name: DataFusion, alone and on Ballista
            run: |
              CRATE=metalake-datafusion bash sql/test.sh --features proto
              CRATE=metalake-ballista bash sql/test.sh
          - name: The command line
            run: CRATE=metalake-cli bash sql/test.sh
          - name: The Iceberg REST server
            clients: true
            java: true
            run: |
              CRATE=metalake-iceberg bash sql/test.sh
              cargo clippy -p metalake-iceberg --all-targets -- -D warnings
    env:
      METALAKE_TEST_PYTHON: python
      METALAKE_TEST_ENGINES: spark,duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Each group keeps what it compiled, the dependencies above all, keyed by the lock: unchanged, they are not
      # compiled again.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - if: matrix.java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Real Iceberg clients
        if: matrix.clients
        run: python -m pip install --quiet "pyiceberg[pyarrow]==0.12.0" duckdb "pyspark==3.5.5"
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
