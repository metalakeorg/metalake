# Builds the wheel of each platform, installs it where nothing else is, and runs what a person would.
name: wheels

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The UI's frontend, built once for every wheel: `metalake-ui` embeds it when the wheel's binary compiles (ADR 0007
  # §5.3).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/metalake-ui/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/metalake-ui/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: crates/metalake-ui/web/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/metalake-ui/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Notebook's ref selector (ADR 0008 §6), built into `dist/labextension/` after the UI's build: the binary
      # embeds it with the UI's files, and gives it to each run of JupyterLab.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The Notebook's ref selector
        working-directory: crates/metalake-ui/jupyter
        run: |
          python -m pip install --quiet "jupyterlab>=4.6,<5"
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../web/dist/labextension/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
          if-no-files-found: error

  # Each platform's wheel, built and then tested, apart from the others: a platform's tests start once its own wheel is
  # built, not once the slowest is. Built where it builds fastest: macOS's Intel wheel on the ARM runner, Windows's on
  # Linux with the Windows SDK that maturin fetches (cargo-xwin). Tested on its own platform.
  windows:
    needs: frontend
    uses: ./.github/workflows/wheel.yml
    secrets: inherit
    with:
      target: x86_64-pc-windows-msvc
      build-runner: ubuntu-latest
      test-runner: windows-latest
      container: "off"
  linux-x86:
    needs: frontend
    uses: ./.github/workflows/wheel.yml
    secrets: inherit
    with:
      target: x86_64-unknown-linux-gnu
      build-runner: ubuntu-latest
      test-runner: ubuntu-latest
      manylinux: "2_34"
  linux-arm:
    needs: frontend
    uses: ./.github/workflows/wheel.yml
    secrets: inherit
    with:
      target: aarch64-unknown-linux-gnu
      build-runner: ubuntu-24.04-arm
      test-runner: ubuntu-24.04-arm
      manylinux: "2_34"
  macos-arm:
    needs: frontend
    uses: ./.github/workflows/wheel.yml
    secrets: inherit
    with:
      target: aarch64-apple-darwin
      build-runner: macos-15
      test-runner: macos-15
  macos-x86:
    needs: frontend
    uses: ./.github/workflows/wheel.yml
    secrets: inherit
    with:
      target: x86_64-apple-darwin
      build-runner: macos-15
      test-runner: macos-15-intel
