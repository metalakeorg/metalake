# Builds the wheel of each platform, installs it where nothing else is, and runs what a person would.
name: wheels

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The UI's frontend, built once for every wheel: `metalake-ui` embeds it when the wheel's binary compiles (ADR 0007
  # §5.3).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/metalake-ui/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/metalake-ui/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: crates/metalake-ui/web/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/metalake-ui/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Notebook's ref selector (ADR 0008 §6), built into `dist/labextension/` after the UI's build: the binary
      # embeds it with the UI's files, and gives it to each run of JupyterLab.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The Notebook's ref selector
        working-directory: crates/metalake-ui/jupyter
        run: |
          python -m pip install --quiet "jupyterlab>=4.6,<5"
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../web/dist/labextension/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
          if-no-files-found: error

  wheel:
    name: ${{ matrix.target }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_34" }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_34" }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare Postgres
        run: python packaging/postgres.py ${{ matrix.target }}
      # Must not be above the manylinux tag, which only the command itself is checked against.
      - name: The oldest C library Postgres needs
        if: runner.os == 'Linux'
        run: |
          objdump -T crates/metalake-py/python/metalake/postgres/bin/postgres \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
      # A wheel without it would serve only the page that says how to build it. Its third-party licenses go with it.
      - name: The UI's frontend is there to embed, and its licenses in the package
        shell: bash
        run: |
          test -f crates/metalake-ui/web/dist/index.html
          mkdir -p crates/metalake-py/python/metalake/licenses
          cp crates/metalake-ui/web/dist/licenses.txt crates/metalake-py/python/metalake/licenses/ui.txt
      # Compiled through sccache, its objects in the Actions cache, one per target: what did not change since a run
      # that saw it is not compiled again, as the dependencies, which are most of the build.
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: "true"
          args: --release --out dist -m crates/metalake-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
      - name: Run what a person would
        shell: bash
        run: bash packaging/e2e.sh dist/*.whl
      - name: The Python API, with no pyarrow
        shell: bash
        run: bash packaging/python_tests.sh dist/*.whl bare
      - name: The Python API, with today's libraries
        shell: bash
        run: bash packaging/python_tests.sh dist/*.whl current
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The Python API, on the oldest Python and libraries it promises
        shell: bash
        run: bash packaging/python_tests.sh dist/*.whl oldest
      - uses: dtolnay/rust-toolchain@stable
      - name: Test a lake's own Postgres
        run: cargo test -p metalake-local
        env:
          # What was prepared above: the release listing is rate limited on a runner's shared address.
          METALAKE_POSTGRES_BIN: ${{ github.workspace }}/crates/metalake-py/python/metalake/postgres/bin
