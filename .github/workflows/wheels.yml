# Builds the wheel of each platform, installs it where nothing else is, and runs what a person would.
name: wheels

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The UI's frontend, built once for every wheel: `metalake-ui` embeds it when the wheel's binary compiles (ADR 0007
  # §5.3).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/metalake-ui/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/metalake-ui/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: crates/metalake-ui/web/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/metalake-ui/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Notebook's ref selector (ADR 0008 §6), built into `dist/labextension/` after the UI's build: the binary
      # embeds it with the UI's files, and gives it to each run of JupyterLab.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The Notebook's ref selector
        working-directory: crates/metalake-ui/jupyter
        run: |
          python -m pip install --quiet "jupyterlab>=4.6,<5"
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../web/dist/labextension/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
          if-no-files-found: error

  # Each target's wheel, built where it builds fastest: macOS's Intel wheel on the ARM runner, which compiles it in less
  # than half the time of the Intel one, and Windows's on Linux, with the Windows SDK that maturin fetches (cargo-xwin).
  # Tested below, each on its own platform.
  wheel:
    name: ${{ matrix.target }}
    needs: frontend
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-pc-windows-msvc, container: "off" }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_34" }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_34" }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15, target: x86_64-apple-darwin }
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      RUSTC_WRAPPER: ${{ secrets.R2_ACCESS_KEY_ID != '' && 'sccache' || '' }}
      SCCACHE_BUCKET: metalake-sccache
      SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      SCCACHE_S3_USE_SSL: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SCCACHE_R2_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      SCCACHE_R2_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare Postgres
        run: python packaging/postgres.py ${{ matrix.target }}
      # Must not be above the manylinux tag, which only the command itself is checked against.
      - name: The oldest C library Postgres needs
        if: runner.os == 'Linux'
        run: |
          objdump -T crates/metalake-py/python/metalake/postgres/bin/postgres \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
      # A wheel without it would serve only the page that says how to build it. Its third-party licenses go with it.
      - name: The UI's frontend is there to embed, and its licenses in the package
        shell: bash
        run: |
          test -f crates/metalake-ui/web/dist/index.html
          mkdir -p crates/metalake-py/python/metalake/licenses
          cp crates/metalake-ui/web/dist/licenses.txt crates/metalake-py/python/metalake/licenses/ui.txt
      # Windows's C, compiled and linked on Linux: clang-cl, lld-link and llvm-lib.
      - name: LLVM, for Windows's wheel
        if: runner.os == 'Linux' && contains(matrix.target, 'windows')
        run: sudo apt-get install -y --no-install-recommends clang lld llvm
      # What compiled before comes from a bucket in Cloudflare's R2, which charges nothing for reads: only what changed
      # since a build that saw it compiles again. maturin's own `sccache` would keep it in the Actions cache, whose 10 GB
      # the other jobs fill. Without the bucket's key (a fork, a call that passes no secrets), the build compiles all.
      - name: sccache
        if: env.RUSTC_WRAPPER == 'sccache'
        run: python -m pip install --quiet "sccache>=0.10.0"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container || '' }}
          args: --release --out dist -m crates/metalake-py/Cargo.toml
          # maturin's container sees only the variables it allows, `SCCACHE_*` among them: the key reaches it so.
          before-script-linux: |
            if [ "$RUSTC_WRAPPER" = sccache ]; then
              command -v sccache >/dev/null || python3 -m pip install --quiet "sccache>=0.10.0" || uv tool install "sccache>=0.10.0"
              export AWS_ACCESS_KEY_ID="$SCCACHE_R2_KEY_ID" AWS_SECRET_ACCESS_KEY="$SCCACHE_R2_SECRET"
            fi
      - name: What the cache held
        if: env.RUSTC_WRAPPER == 'sccache' && (runner.os != 'Linux' || matrix.container == 'off')
        run: sccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # Each wheel's tests, on its own platform and in three groups at once: the wheel's time is its build and its longest
  # group, not the sum of them.
  test:
    name: ${{ matrix.platform.target }} · ${{ matrix.group }}
    needs: wheel
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
        # `install`: what a person would, the API with no pyarrow, and a lake's own Postgres. `current` and `oldest`:
        # the API with today's libraries, and with the oldest Python and libraries it promises.
        group: [install, current, oldest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.group == 'oldest' && '3.11' || '3.12' }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform.target }}
          path: dist
      - name: Run what a person would
        if: matrix.group == 'install'
        shell: bash
        run: bash packaging/e2e.sh dist/*.whl
      - name: The Python API, with no pyarrow
        if: matrix.group == 'install'
        shell: bash
        run: bash packaging/python_tests.sh dist/*.whl bare
      - name: The Python API, with today's libraries
        if: matrix.group == 'current'
        shell: bash
        run: bash packaging/python_tests.sh dist/*.whl current
      - name: The Python API, on the oldest Python and libraries it promises
        if: matrix.group == 'oldest'
        shell: bash
        run: bash packaging/python_tests.sh dist/*.whl oldest
      - name: Prepare Postgres
        if: matrix.group == 'install'
        run: python packaging/postgres.py ${{ matrix.platform.target }}
      - if: matrix.group == 'install'
        uses: dtolnay/rust-toolchain@stable
      - name: Test a lake's own Postgres
        if: matrix.group == 'install'
        run: cargo test -p metalake-local
        env:
          # What was prepared above: the release listing is rate limited on a runner's shared address.
          METALAKE_POSTGRES_BIN: ${{ github.workspace }}/crates/metalake-py/python/metalake/postgres/bin
