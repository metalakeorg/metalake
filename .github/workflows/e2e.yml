# The end-to-end test of MetaLake in Arroyo (crates/metalake-arroyo/e2e): Arroyo built from our fork, a Postgres for the
# catalog, and a pipeline of standard SQL over the lake's names, through inserts, deletes and a restart. Building
# Arroyo's image is long, so it runs when the test changes, and by hand.
name: e2e

on:
  pull_request:
    paths:
      - crates/metalake-arroyo/e2e/**
      - .github/workflows/e2e.yml
  workflow_dispatch:
    inputs:
      arroyo_ref:
        description: The branch of describeloai/arroyo to build Arroyo from
        default: master

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arroyo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      # Arroyo's image builds Rust in Docker, which a runner's disk barely holds with its preinstalled toolchains.
      - name: Room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      # Until describeloai/arroyo#1 merges, the hook that finds the lake's names is on its branch.
      - name: The end-to-end test
        env:
          ARROYO_REF: ${{ inputs.arroyo_ref || 'feat/metalake-resolve' }}
        run: bash crates/metalake-arroyo/e2e/run.sh
