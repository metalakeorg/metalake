# The end-to-end test of MetaLake in Arroyo (crates/metalake-arroyo/e2e): Arroyo from our fork, a Postgres for the
# catalog, and a pipeline of standard SQL over the lake's names, through inserts, deletes and a restart. Arroyo is
# not built here: the fork's `metalake` workflow publishes its image once per commit, after its planner test passes,
# and this pulls it. MetaLake's command line is built on the runner, with a cache, so a run takes minutes.
name: e2e

on:
  pull_request:
    paths:
      - crates/metalake-arroyo/e2e/**
      - crates/metalake-client/src/pipeline/**
      - crates/metalake-client/tests/c14_pipeline.rs
      - .github/workflows/e2e.yml
  workflow_dispatch:
    inputs:
      arroyo_image:
        description: Arroyo's image, as the fork publishes it (a branch or a commit as its tag)
        default: ghcr.io/describeloai/arroyo-metalake:feat-metalake-resolve

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arroyo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-cli
          # the build is what takes long: kept even when the test after it fails
          cache-on-failure: true
      - name: MetaLake's command line
        run: cargo build --release --locked -p metalake-cli
      # Until describeloai/arroyo#1 merges, the hook that finds the lake's names is on its branch's image.
      - name: The end-to-end test
        env:
          ARROYO_IMAGE: ${{ inputs.arroyo_image || 'ghcr.io/describeloai/arroyo-metalake:feat-metalake-resolve' }}
          METALAKE_BIN: target/release/metalake
        run: |
          docker pull "$ARROYO_IMAGE"
          bash crates/metalake-arroyo/e2e/run.sh
      # The same pipeline, as the client creates, suspends, resumes and drops it, Arroyo in a container of its image.
      - name: A pipeline through the client
        env:
          METALAKE_ARROYO_IMAGE: ${{ inputs.arroyo_image || 'ghcr.io/describeloai/arroyo-metalake:feat-metalake-resolve' }}
          METALAKE_PIPELINE_TEST: '1'
        run: CRATE=metalake-client bash sql/test.sh --test c14_pipeline -- --nocapture
