# The UI (ADR 0007): the frontend, checked and built with the Node and pnpm it pins; `metalake-ui`, the crate that embeds
# it, linted and tested without the frontend and with the one just built, on Linux and Windows; and `metalake ui`, the
# binary built from this checkout, stopped by a signal and driven by a browser.
name: ui

on:
  push:
    branches: [main]
    paths: ["crates/metalake-ui/**", "crates/metalake-cli/**", "packaging/e2e_ui.py", "Cargo.lock", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["crates/metalake-ui/**", "crates/metalake-cli/**", "packaging/e2e_ui.py", "Cargo.lock", ".github/workflows/ui.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/metalake-ui/web
    steps:
      - uses: actions/checkout@v4
      # The version `packageManager` pins, checked against its hash.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/metalake-ui/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: crates/metalake-ui/web/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/metalake-ui/web/pnpm-lock.yaml
      - name: Install, as the lockfile says
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm check
      - name: Types
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Sizes
        run: |
          {
            echo "### The frontend's build"
            echo '| File | Bytes | Brotli |'
            echo '|---|---:|---:|'
            find dist -type f ! -name '*.br' ! -name '*.gz' | sort | while read -r f; do
              br=$( [ -f "$f.br" ] && stat -c %s "$f.br" || echo '' )
              echo "| ${f#dist/} | $(stat -c %s "$f") | $br |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
          if-no-files-found: error

  crate:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -p metalake-ui --check
      - name: Lints
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p metalake-ui --all-targets -- -D warnings
      # A checkout has no frontend built: the crate compiles and serves the page that says how to build it.
      - name: Tests, the frontend not built
        run: cargo test --locked -p metalake-ui
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
      - name: Tests, the frontend embedded
        run: cargo test --locked -p metalake-ui

  # The binary a user runs, built with the frontend embedded: its life as a process, then a browser against it.
  e2e:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Line tables are enough for a backtrace, and keep the link of the whole of MetaLake light.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
      - name: Format of the verb
        run: cargo fmt -p metalake-cli --check
      - name: Build `metalake`
        run: cargo build --locked -p metalake-cli
      - name: "`metalake ui`: serves, refuses who may not use it, then stops on SIGINT with nothing left"
        run: |
          token=ci0ci0ci0ci0ci0ci0ci0ci0ci0ci0ci0ci0ci0
          METALAKE_UI_TOKEN=$token ./target/debug/metalake ui --no-browser --port 4174 > ui.out 2> ui.err &
          pid=$!
          for _ in $(seq 100); do curl -sf -o /dev/null http://127.0.0.1:4174/ && break; sleep 0.1; done
          test "$(head -1 ui.out)" = "http://127.0.0.1:4174/#token=$token"
          curl -sf http://127.0.0.1:4174/ | grep -q '<div id="root">'
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://127.0.0.1:4174/api/v1/version)" = 401
          test "$(code -H "Authorization: Bearer $token" http://127.0.0.1:4174/api/v1/version)" = 200
          test "$(code -H 'Host: evil.example:4174' http://127.0.0.1:4174/)" = 403
          test "$(code -X POST -H "Authorization: Bearer $token" -H 'Origin: http://evil.example'             http://127.0.0.1:4174/api/v1/version)" = 403
          kill -INT "$pid"
          wait "$pid" || { echo "exit $?"; cat ui.err; exit 1; }
          if curl -s -o /dev/null http://127.0.0.1:4174/; then echo "still listening" && exit 1; fi
          ./target/debug/metalake ui --no-browser --port 4174 > /dev/null 2>&1 & first=$!
          sleep 1
          if ./target/debug/metalake ui --no-browser --port 4174 2> taken.err; then echo "a taken port served" && exit 1; fi
          grep -q "port 4174 is taken" taken.err
          kill -INT "$first" && wait "$first"
      # What every wheel's e2e.sh checks of the `metalake` it installs, here of the one built from this branch.
      - name: "`metalake ui` as a wheel's is checked: the application, its API, its licenses"
        run: python3 packaging/e2e_ui.py ./target/debug/metalake
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/metalake-ui/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: crates/metalake-ui/web/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/metalake-ui/web/pnpm-lock.yaml
      - name: Playwright and its Chromium
        working-directory: crates/metalake-ui/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Playwright against `metalake ui`
        working-directory: crates/metalake-ui/web
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: crates/metalake-ui/web/test-results
          if-no-files-found: ignore
