# The UI (ADR 0007): the frontend, checked and built with the Node and pnpm it pins; then `metalake-ui`, the crate that
# embeds it, linted and tested without the frontend and with the one just built.
name: ui

on:
  push:
    branches: [main]
    paths: ["crates/metalake-ui/**", "Cargo.lock", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["crates/metalake-ui/**", "Cargo.lock", ".github/workflows/ui.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crates/metalake-ui/web
    steps:
      - uses: actions/checkout@v4
      # The version `packageManager` pins, checked against its hash.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/metalake-ui/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: crates/metalake-ui/web/.nvmrc
          cache: pnpm
          cache-dependency-path: crates/metalake-ui/web/pnpm-lock.yaml
      - name: Install, as the lockfile says
        run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm check
      - name: Types
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Sizes
        run: |
          {
            echo "### The frontend's build"
            echo '| File | Bytes | Brotli |'
            echo '|---|---:|---:|'
            find dist -type f ! -name '*.br' ! -name '*.gz' | sort | while read -r f; do
              br=$( [ -f "$f.br" ] && stat -c %s "$f.br" || echo '' )
              echo "| ${f#dist/} | $(stat -c %s "$f") | $br |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
          if-no-files-found: error

  crate:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt -p metalake-ui --check
      - name: Lints
        run: cargo clippy --locked -p metalake-ui --all-targets -- -D warnings
      # A checkout has no frontend built: the crate compiles and serves the page that says how to build it.
      - name: Tests, the frontend not built
        run: cargo test --locked -p metalake-ui
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: crates/metalake-ui/web/dist
      - name: Tests, the frontend embedded
        run: cargo test --locked -p metalake-ui
