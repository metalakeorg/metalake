[package]
name = "metalake-arroyo"
version = "0.0.0"
description = "MetaLake's connector for Arroyo: tables followed as rows inserted and deleted, and written in two phases"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/metalakeorg/metalake"
publish = false

# A workspace of its own: Arroyo's crates need Arrow 58.4 and Arroyo's forks of parquet, DataFusion and sqlparser,
# while MetaLake's workspace resolves the core to Arrow 59 for metalake-datafusion. Its lock holds Arrow at 58.4.
[workspace]

[dependencies]
metalake = { path = "../metalake", features = ["s3", "gcs", "azure"] }
metalake-pg = { path = "../metalake-pg" }
arroyo-operator = { git = "https://github.com/describeloai/arroyo", rev = "b02c16daa739361275e7c8cf76a4032e4a3ee79e" }
arroyo-rpc = { git = "https://github.com/describeloai/arroyo", rev = "b02c16daa739361275e7c8cf76a4032e4a3ee79e" }
arroyo-state = { git = "https://github.com/describeloai/arroyo", rev = "b02c16daa739361275e7c8cf76a4032e4a3ee79e" }
arroyo-types = { git = "https://github.com/describeloai/arroyo", rev = "b02c16daa739361275e7c8cf76a4032e4a3ee79e" }
arrow-array = "=58.4.0"
arrow-buffer = "=58.4.0"
arrow-cast = "=58.4.0"
arrow-schema = "=58.4.0"
datafusion = "=54.1.0"
anyhow = "1.0.82"
async-trait = "0.1.80"
chrono = "0.4"
prost = "0.14"
futures = "0.3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
arrow-select = "=58.4.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Arroyo's, verbatim from its Cargo.toml at the rev above: a dependency's patches don't reach the crate that depends on
# it. `ci/arroyo-patch.sh` checks that they're the same.
[patch.crates-io]
typify = { git = 'https://github.com/ArroyoSystems/typify.git', branch = 'arroyo' }
parquet = { git = "https://github.com/ArroyoSystems/arrow-rs", branch = "58.4.0/arroyo" }
arrow-json = { git = "https://github.com/ArroyoSystems/arrow-rs", branch = "58.4.0/arroyo" }
datafusion = { git = "https://github.com/ArroyoSystems/arrow-datafusion", rev = "0b17b6de84ede334a292c5e3037beb550a90d184" }
datafusion-common = { git = "https://github.com/ArroyoSystems/arrow-datafusion", rev = "0b17b6de84ede334a292c5e3037beb550a90d184" }
datafusion-execution = { git = "https://github.com/ArroyoSystems/arrow-datafusion", rev = "0b17b6de84ede334a292c5e3037beb550a90d184" }
datafusion-expr = { git = "https://github.com/ArroyoSystems/arrow-datafusion", rev = "0b17b6de84ede334a292c5e3037beb550a90d184" }
datafusion-physical-expr = { git = "https://github.com/ArroyoSystems/arrow-datafusion", rev = "0b17b6de84ede334a292c5e3037beb550a90d184" }
datafusion-physical-plan = { git = "https://github.com/ArroyoSystems/arrow-datafusion", rev = "0b17b6de84ede334a292c5e3037beb550a90d184" }
datafusion-proto = { git = "https://github.com/ArroyoSystems/arrow-datafusion", rev = "0b17b6de84ede334a292c5e3037beb550a90d184" }
datafusion-functions = { git = "https://github.com/ArroyoSystems/arrow-datafusion", rev = "0b17b6de84ede334a292c5e3037beb550a90d184" }
datafusion-functions-window = { git = "https://github.com/ArroyoSystems/arrow-datafusion", rev = "0b17b6de84ede334a292c5e3037beb550a90d184" }

sqlparser = { git = "https://github.com/ArroyoSystems/sqlparser-rs", branch = "0.62.0/arroyo" }

cornucopia_async = { git = "https://github.com/ArroyoSystems/cornucopia", branch = "sqlite" }
cornucopia = { git = "https://github.com/ArroyoSystems/cornucopia", branch = "sqlite" }
jiter = { git = "https://github.com/ArroyoSystems/jiter", branch = "0.15.0/arroyo" }
