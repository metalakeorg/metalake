[package]
name = "metalake-cli"
version = "0.0.0"
description = "MetaLake's command line: every verb, over the core and the DataFusion adapter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "metalake_cli"
path = "src/lib.rs"

[[bin]]
name = "metalake"
path = "src/main.rs"

[dependencies]
metalake = { workspace = true, features = ["s3", "gcs", "azure"] }
metalake-pg.workspace = true
metalake-datafusion = { path = "../metalake-datafusion" }
metalake-local = { path = "../metalake-local" }
clap = { version = "4", features = ["derive"] }
datafusion = { version = "55.2", default-features = false, features = [
    "datetime_expressions",
    "encoding_expressions",
    "math_expressions",
    "nested_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
toml = "1"
url.workspace = true
