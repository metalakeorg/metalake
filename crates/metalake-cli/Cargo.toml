[package]
name = "metalake-cli"
version = "0.1.0"
description = "MetaLake's command line: every verb, over the core and the DataFusion adapter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "metalake_cli"
path = "src/lib.rs"

[[bin]]
name = "metalake"
path = "src/main.rs"

[dependencies]
metalake-client = { path = "../metalake-client" }
clap = { version = "4", features = ["derive"] }
datafusion = { version = "55.2", default-features = false }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "time"] }
