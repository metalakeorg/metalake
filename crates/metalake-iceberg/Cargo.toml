[package]
name = "metalake-iceberg"
version = "0.0.0"
description = "MetaLake's Iceberg REST server: a table as Iceberg clients expect it, from the catalog's rows"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "metalake_iceberg"
path = "src/lib.rs"

[[bin]]
name = "metalake-iceberg"
path = "src/main.rs"

[dependencies]
metalake.workspace = true
metalake-pg.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
apache-avro = { version = "0.22", features = ["zstandard"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time"] }
