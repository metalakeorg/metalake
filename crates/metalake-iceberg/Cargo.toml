[package]
name = "metalake-iceberg"
version = "0.0.0"
description = "MetaLake's Iceberg REST server: a table as Iceberg clients expect it, from the catalog's rows"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "metalake_iceberg"
path = "src/lib.rs"

[[bin]]
name = "metalake-iceberg"
path = "src/main.rs"

[dependencies]
metalake.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
bytes.workspace = true
parquet.workspace = true
apache-avro = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
url.workspace = true
uuid.workspace = true
# Minting credentials for a table's files (REST-11): the store's own credential, SigV4, and the token services.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
hmac = "0.13"
object_store = { workspace = true, features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
sha2 = "0.11"
url.workspace = true

[dev-dependencies]
metalake-pg.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "time"] }
