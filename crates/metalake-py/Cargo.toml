[package]
name = "metalake-py"
version = "0.4.0"
description = "MetaLake's Python package: the command line and the Python API, in one library"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_metalake"
crate-type = ["cdylib"]

[features]
# Sessions that reach a Ballista scheduler, when a lake names one.
distributed = ["metalake-client/distributed"]

[dependencies]
metalake-cli = { path = "../metalake-cli" }
metalake-client = { path = "../metalake-client" }
datafusion = { version = "55.2", default-features = false }
futures-util.workspace = true
tokio = { workspace = true, features = ["sync"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
pyo3-arrow = { version = "0.20", default-features = false }
