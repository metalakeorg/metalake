[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "metalake"
description = "Open-source lakehouse table format & protocol inside a PostgreSQL catalog"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["lakehouse", "parquet", "postgres", "datafusion", "table-format"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
]
dynamic = ["version"]

[project.optional-dependencies]
polars = ["polars>=1.22"]
pyarrow = ["pyarrow>=15"]
pandas = ["pandas", "pyarrow>=15"]

[project.scripts]
metalake = "metalake:_main"

[project.urls]
Repository = "https://github.com/metalakeorg/metalake"

[tool.maturin]
module-name = "metalake._metalake"
python-source = "python"
include = [{ path = "python/metalake/postgres/**/*", format = "wheel" }]

[tool.mypy]
ignore_missing_imports = true
