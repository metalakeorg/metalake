[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "metalake"
description = "An open lakehouse table format whose metadata lives in Postgres"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["lakehouse", "parquet", "postgres", "datafusion", "table-format"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
]
dynamic = ["version"]

[project.scripts]
metalake = "metalake:_main"

[project.urls]
Repository = "https://github.com/metalakeorg/metalake"

[tool.maturin]
module-name = "metalake._metalake"
python-source = "python"
include = [{ path = "python/metalake/postgres/**/*", format = "wheel" }]
