[package]
name = "metalake-datafusion"
version = "0.0.0"
description = "MetaLake in DataFusion: refs as catalogs, namespaces as schemas, and tables planned by the protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A plan that crosses processes (Ballista, or any engine that ships DataFusion's plans): MetaLake's codecs.
proto = ["dep:datafusion-proto", "dep:postcard", "dep:prost", "dep:serde", "dep:serde_json"]

[dependencies]
metalake.workspace = true
async-trait = "0.1"
datafusion = { version = "55.2", default-features = false, features = ["parquet", "sql"] }
datafusion-proto = { version = "55.2", default-features = false, features = ["parquet"], optional = true }
futures-util.workspace = true
object_store.workspace = true
postcard = { workspace = true, optional = true }
prost = { version = "0.14", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono = "0.4"
arrow-array.workspace = true
arrow-schema.workspace = true
metalake-pg.workspace = true
serde_json.workspace = true
tokio.workspace = true
