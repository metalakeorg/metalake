[package]
name = "metalake"
version = "0.0.0"
description = "MetaLake's core: tables as Arrow, statistics, deletion vectors, storage, scans and writes, over the protocol in Postgres"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Each cloud's store, and the token its managed Postgres takes for the client's identity (`credential`).
s3 = ["object_store/aws", "dep:hmac", "dep:sha2"]
gcs = ["object_store/gcp", "dep:reqwest", "dep:ring", "dep:base64"]
azure = ["object_store/azure", "dep:reqwest"]

[dependencies]
metalake-pg.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
arrow-array.workspace = true
arrow-select.workspace = true
futures-util.workspace = true
object_store.workspace = true
tokio = { workspace = true, features = ["time", "rt"] }
bytes.workspace = true
roaring.workspace = true
crc32fast.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
url.workspace = true
base64 = { version = "0.22", optional = true }
hmac = { version = "0.13", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"], optional = true }
ring = { version = "0.17", optional = true }
sha2 = { version = "0.11", optional = true }

[dev-dependencies]
async-trait = "0.1"
postcard.workspace = true
tokio.workspace = true
