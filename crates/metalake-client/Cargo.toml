[package]
name = "metalake-client"
version = "0.10.0"
description = "What MetaLake's faces share: reaching a lake, and every verb as a call that answers values"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
metalake = { workspace = true, features = ["s3", "gcs", "azure", "hdfs"] }
metalake-pg.workspace = true
metalake-datafusion = { path = "../metalake-datafusion" }
metalake-local = { path = "../metalake-local" }
# A lake's sessions reach a Ballista cluster through the router, with `distributed`.
metalake-ballista = { path = "../metalake-ballista", optional = true }
datafusion = { version = "55.2", default-features = false, features = [
    "datetime_expressions",
    "encoding_expressions",
    "math_expressions",
    "nested_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
] }
futures-util.workspace = true
object_store = { workspace = true, features = ["http"] }
serde.workspace = true
sha2 = "0.11"
# Flink's rows read as their text, a DECIMAL's digits all kept.
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["time", "sync"] }
# Engines elsewhere, as Trino, sent statements by their HTTP protocol.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
base64 = "0.22"
# Spark, sent statements through Spark Connect's gRPC: the code its protos make is in src/engine/spark/proto, checked in.
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
uuid.workspace = true
toml = "1"
# A lake's file edited in place, its comments kept.
toml_edit = "0.25"
url.workspace = true

[features]
# Sessions that reach a Ballista scheduler, when a lake names one (`METALAKE_SCHEDULER`, `scheduler` in its file).
distributed = ["dep:metalake-ballista"]

[target.'cfg(windows)'.dependencies]
# To start a lake's server holding none of this process's own handles (§ server::start).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
arrow-schema.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# A Trino that answers as the tests say, to send statements to.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
