[package]
name = "metalake-client"
version = "0.1.0"
description = "What MetaLake's faces share: reaching a lake, and every verb as a call that answers values"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
metalake = { workspace = true, features = ["s3", "gcs", "azure"] }
metalake-pg.workspace = true
metalake-datafusion = { path = "../metalake-datafusion" }
metalake-local = { path = "../metalake-local" }
# A lake's sessions reach a Ballista cluster through the router, with `distributed`.
metalake-ballista = { path = "../metalake-ballista", optional = true }
datafusion = { version = "55.2", default-features = false, features = [
    "datetime_expressions",
    "encoding_expressions",
    "math_expressions",
    "nested_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
] }
futures-util.workspace = true
object_store = { workspace = true, features = ["http"] }
serde.workspace = true
sha2 = "0.11"
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
uuid.workspace = true
toml = "1"
url.workspace = true

[features]
# Sessions that reach a Ballista scheduler, when a lake names one (`METALAKE_SCHEDULER`, `scheduler` in its file).
distributed = ["dep:metalake-ballista"]

[target.'cfg(windows)'.dependencies]
# To start a lake's server holding none of this process's own handles (§ server::start).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
arrow-schema.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
