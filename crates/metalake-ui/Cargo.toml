[package]
name = "metalake-ui"
version = "0.0.0"
description = "MetaLake's UI: an axum router that serves the frontend embedded in it (ADR 0007)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The frontend's source and its tooling are not the crate's: only what `pnpm build` writes is.
include = ["src/**", "web/dist/**", "build.rs", "Cargo.toml"]

[lib]
name = "metalake_ui"
path = "src/lib.rs"

[features]
default = ["lake"]
# The API over a lake, through metalake-client, which links the whole of MetaLake. Without it the router, the guard and
# the frontend compile in seconds, over a backend a test or an example gives (`api::Detached`).
lake = ["dep:metalake-client", "dep:datafusion"]

[dependencies]
metalake-client = { path = "../metalake-client", optional = true }
# Over a lake, a statement's rows are written as Arrow IPC, with the Arrow DataFusion answers them in.
datafusion = { version = "55.2", default-features = false, optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# The API's OpenAPI spec, from the handlers and the types they answer, which the frontend's types are generated from.
utoipa = "6"
# `debug-embed`: a debug build embeds as a release one does, so that both serve the same files; `mime-guess`: each
# file's type; `include-exclude`: the `.gitkeep` that keeps `web/dist/` is not served.
rust-embed = { version = "8.9", features = ["debug-embed", "mime-guess", "include-exclude"] }
tokio = { workspace = true, features = ["net", "process", "sync", "time"] }
# The run's token, from the system's source of randomness.
getrandom = "0.3"
# Opens the redirect file in the user's default browser, on Windows, macOS and Linux.
webbrowser = "1.2"

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
