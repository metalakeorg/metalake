    <title>MetaLake: the UI was not built</title>
  </head>
  <body>
    <h1>MetaLake's UI was not built</h1>
    <p>
      This <code>metalake</code> was compiled without its frontend. Build it, then compile again:
    </p>
    <pre>pnpm --dir crates/metalake-ui/web install --frozen-lockfile
pnpm --dir crates/metalake-ui/web build
cargo build</pre>
    <p>A <code>metalake</code> installed with <code>pip</code> always carries it.</p>
  </body>
</html>
