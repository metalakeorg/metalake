# A Hadoop cluster in small, as a migration starts from: HDFS, and Hive writing its tables there as Parquet. MetaLake,
# installed on the host with pip, takes those tables over in place, its catalog in a Postgres apart from both.
#
#   docker compose -f demo/hive-hdfs/compose.yml up -d --wait
#   docker compose -f demo/hive-hdfs/compose.yml down
#
# The cluster's own name is `127.0.0.1` (not `localhost`, which Windows resolves to ::1 first, where Docker publishes
# nothing): the NameNode, the DataNode and Hive share one network namespace, the
# NameNode's, and publish their ports on the host's. So Hive writes `hdfs://127.0.0.1:9000/...`, and a client on the
# host reaches that same URL with no name to resolve; a real cluster has DNS for that. A client outside the
# namespace reaches the DataNode by its name, `127.0.0.1`, not by its address inside Docker: client/ is that
# client's Hadoop configuration, which HADOOP_CONF_DIR names.
name: metalake-hive-hdfs

x-hadoop: &hadoop
  image: apache/hadoop:3.4.3
  environment: &hadoop-conf
    CORE-SITE.XML_fs.defaultFS: hdfs://127.0.0.1:9000
    HDFS-SITE.XML_dfs.replication: "1"
    HDFS-SITE.XML_dfs.permissions.enabled: "false"
    HDFS-SITE.XML_dfs.namenode.name.dir: /tmp/hadoop/dfs/name
    HDFS-SITE.XML_dfs.datanode.data.dir: /tmp/hadoop/dfs/data
    HDFS-SITE.XML_dfs.datanode.hostname: 127.0.0.1
    # The NameNode listens on every interface, so that the port Docker publishes reaches it, not on 127.0.0.1 alone.
    HDFS-SITE.XML_dfs.namenode.rpc-bind-host: 0.0.0.0

services:
  namenode:
    <<: *hadoop
    command: hdfs namenode
    environment:
      <<: *hadoop-conf
      ENSURE_NAMENODE_DIR: /tmp/hadoop/dfs/name
    # Every port of the namespace: the NameNode's web (9870) and RPC (9000), the DataNode's data transfer (9866),
    # HiveServer2 (10000) and its web (10002).
    ports: ["9870:9870", "9000:9000", "9866:9866", "10000:10000", "10002:10002"]
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1)' && hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 3s
      retries: 60

  datanode:
    <<: *hadoop
    command: hdfs datanode
    network_mode: service:namenode
    depends_on: [namenode]

  # HiveServer2 with its metastore embedded; its warehouse on HDFS. Tez runs its queries in local mode.
  hive:
    image: apache/hive:4.0.1
    network_mode: service:namenode
    environment:
      SERVICE_NAME: hiveserver2
      # Hive's ACID on, for ops.pedidos: a transaction manager, locks, and a compactor in the server itself.
      SERVICE_OPTS: >-
        -Dhive.metastore.warehouse.dir=hdfs://127.0.0.1:9000/user/hive/warehouse
        -Dhive.support.concurrency=true
        -Dhive.txn.manager=org.apache.hadoop.hive.ql.lockmgr.DbTxnManager
        -Dhive.compactor.initiator.on=true
        -Dhive.compactor.worker.threads=1
    volumes:
      - ./hive/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hive:/demo:ro
      # Tienda: its scripts, and the data generate.py writes in company/out.
      - ./company:/company:ro
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "beeline -u jdbc:hive2://localhost:10000/ -e 'select 1' >/dev/null 2>&1"]
      interval: 5s
      retries: 60
