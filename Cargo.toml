[workspace]
members = ["crates/*"]
exclude = ["bench/impl", "ci/arrow-58", "crates/metalake-arroyo"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/metalakeorg/metalake"
publish = false

[workspace.dependencies]
metalake = { path = "crates/metalake" }
metalake-pg = { path = "crates/metalake-pg" }
thiserror = "2"
deadpool-postgres = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
futures-util = "0.3"
arrow-schema = ">=58.4, <60"
arrow-array = ">=58.4, <60"
arrow-select = ">=58.4, <60"
parquet = { version = ">=58.4, <60", default-features = false, features = ["arrow", "async", "zstd"] }
object_store = "0.13"
bytes = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
postgres-types = { version = "0.2", features = ["derive"] }
proptest = "1"
roaring = "0.11"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = "thin"
