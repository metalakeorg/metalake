[workspace]
members = ["crates/*"]
exclude = ["bench/impl"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/describeloai/metalake"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
