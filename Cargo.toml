[workspace]
members = ["crates/*"]
exclude = ["bench/impl"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/describeloai/metalake"
publish = false

[workspace.dependencies]
metalake = { path = "crates/metalake" }
metalake-pg = { path = "crates/metalake-pg" }
thiserror = "2"
deadpool-postgres = "0.14"
futures-util = "0.3"
arrow-schema = "59"
arrow-array = "59"
arrow-select = "59"
parquet = { version = "59", default-features = false, features = ["arrow", "async", "zstd"] }
object_store = "0.14"
bytes = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
postgres-types = { version = "0.2", features = ["derive"] }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
